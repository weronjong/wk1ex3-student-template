<!doctype html>
<html>
  <head>
    <title>Demo: Get Started Debugging JavaScript with Chrome DevTools</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
    <h1>Demo: Get Started Debugging JavaScript with Chrome DevTools</h1>
    <label for="num1">Number 1</label>
    <input placeholder="Number 1" id="num1" type="number">
    <label for="num2">Number 2</label>
    <input placeholder="Number 2" id="num2" type="number">
    <button onclick="addNumbers()">Add Number 1 and Number 2</button>
    <p id="result"></p>

    <script>
      function addNumbers() {
        const val1 = document.getElementById('num1').value;
        const val2 = document.getElementById('num2').value;
        const n1 = Number(val1);
        const n2 = Number(val2);
        let output;

        if (val1.trim() === '' || val2.trim() === '' || isNaN(n1) || isNaN(n2)) {
          output = "Please enter numbers only";
        } else {
          output = n1 + n2;
        }

        console.log(output);
        document.getElementById('result').textContent = output;
      }
    </script>
  </body>
</html>
